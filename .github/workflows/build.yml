name: Build NieR Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-nier-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build zip unzip patch

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35, build-tools 35.0.0 and NDK 28.2.13676358
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358"

      # The fixed release key (GitHub secrets NIER_KS_B64, NIER_KS_PASS, NIER_KEY_ALIAS, NIER_KEY_PASS): the same
      # signature on every build, so a new APK installs over the old app. Without the secrets: a throwaway debug key.
      - name: Prepare the signing key
        env:
          NIER_KS_B64: ${{ secrets.NIER_KS_B64 }}
          NIER_KS_PASS: ${{ secrets.NIER_KS_PASS }}
        run: |
          mkdir -p "$HOME/.android"
          if [ -n "$NIER_KS_B64" ]; then
            echo "$NIER_KS_B64" | base64 -d > "$HOME/.android/nier-release.keystore"
            keytool -list -keystore "$HOME/.android/nier-release.keystore" -storepass "$NIER_KS_PASS" > /dev/null \
              || { echo "The release keystore does not open: check NIER_KS_B64 and NIER_KS_PASS" >&2; exit 1; }
            echo "Signing with the fixed release key"
          else
            keytool -genkey -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey \
              -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            echo "No NIER_KS_B64 secret: signing with a throwaway debug key (the APK will not install over an older build)"
          fi

      # CMakeLists.txt reads "$VULKAN_SDK/Include" (capital I): a folder with that name pointing at the headers.
      - name: Vulkan headers 1.4.357
        run: |
          git clone --depth 1 --branch v1.4.357 https://github.com/KhronosGroup/Vulkan-Headers.git /tmp/vkh \
            || git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Headers.git /tmp/vkh
          mkdir -p "$HOME/vulkan-sdk"
          ln -s /tmp/vkh/include "$HOME/vulkan-sdk/Include"
          test -f "$HOME/vulkan-sdk/Include/vulkan/vulkan.h"

      # The shader translator for the phone (Ryujinx's, NativeAOT): slow, so it is cached until the translator changes.
      - name: Cache the shader translator
        id: harness
        uses: actions/cache@v4
        with:
          path: private/build/spirv_harness_android_nier/libspirvharness.so
          key: harness-nier-${{ hashFiles('tools/maxwell/**', 'games/nier/tools/build_harness_android.sh') }}

      - name: Fetch the Ryubing source
        if: steps.harness.outputs.cache-hit != 'true'
        run: |
          mkdir -p private/third_party/ryubing
          curl -fL --retry 5 --retry-delay 5 https://codeberg.org/Software_arch/Ryubing/archive/a82350bb77.tar.gz \
            | tar -xz -C private/third_party/ryubing --strip-components=1

      - name: Build the shader translator
        if: steps.harness.outputs.cache-hit != 'true'
        run: |
          docker run --rm -v "$PWD:/src" -w /src mcr.microsoft.com/dotnet/sdk:10.0 sh games/nier/tools/build_harness_android.sh
          sudo chown -R "$USER" private

      - name: Fetch libopus 1.5.2 (hwopus decodes the game's Opus sound effects and voices with it)
        run: |
          set -e
          mkdir -p private/third_party/opus-1.5.2
          curl -fL --retry 5 --retry-delay 5 https://downloads.xiph.org/releases/opus/opus-1.5.2.tar.gz -o "$RUNNER_TEMP/opus.tar.gz"
          sha256sum "$RUNNER_TEMP/opus.tar.gz"
          tar -xz -f "$RUNNER_TEMP/opus.tar.gz" -C private/third_party/opus-1.5.2 --strip-components=1
          test -f private/third_party/opus-1.5.2/CMakeLists.txt

      - name: Build the NieR APK
        env:
          NIER_KS_PASS: ${{ secrets.NIER_KS_PASS }}
          NIER_KEY_PASS: ${{ secrets.NIER_KEY_PASS }}
          NIER_KEY_ALIAS: ${{ secrets.NIER_KEY_ALIAS }}
        run: |
          export VULKAN_SDK="$HOME/vulkan-sdk"
          bash android/build_nier_ci.sh

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: nier-apk
          path: private/nier/apk_nce/nier.apk
          if-no-files-found: error

      - name: Upload libnier.so with symbols (to name the hot spots of a profile.txt)
        uses: actions/upload-artifact@v4
        with:
          name: nier-symbols
          path: private/nier/ba_nce/libnier.so
          if-no-files-found: warn
          retention-days: 30
